<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>BioAttend - Gestion</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; background: #f8f9fc; }
        .sidebar { width: 250px; background: #2c3e50; color: white; min-height: 100vh; padding: 20px; }
        .content { flex: 1; padding: 40px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        .btn-csv { background: #1cc88a; color: white; padding: 10px; border-radius: 5px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>BioAttend</h2>
        <p><a href="{% url 'Employee:utilisateur_list' %}" style="color:white; text-decoration:none;"><i class="fas fa-users"></i> Utilisateurs</a></p>
        <p><a href="{% url 'Employee:pointage_list' %}" style="color:white; text-decoration:none;"><i class="fas fa-clock"></i> Pointages</a></p>
        <p><a href="{% url 'Employee:alerte_list' %}" style="color:white; text-decoration:none;"><i class="fas fa-exclamation-triangle"></i> Alertes</a></p>
        <p><a href="{% url 'Employee:role_list' %}" style="color:white; text-decoration:none;"><i class="fas fa-user-tag"></i> Rôles</a></p>
    </div>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
