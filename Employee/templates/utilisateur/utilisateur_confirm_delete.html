{% extends "utilisateur/base.html" %}
{% block content %}
<div class="card" style="max-width: 700px; margin: auto;">
    <h1>Supprimer l'employé</h1>
    <p>Êtes-vous sûr de vouloir supprimer <strong>{{ utilisateur.Prenom }} {{ utilisateur.Nom }}</strong> ?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-csv" style="background:#e74a3b;">Confirmer la suppression</button>
        <a href="{% url 'Employee:utilisateur_list' %}" class="btn-csv" style="background:#6c757d;">Annuler</a>
    </form>
</div>
{% endblock %}
