{% extends "utilisateur/base.html" %}
{% block content %}
<div class="card" style="max-width: 700px; margin: auto;">
    <h1>{{ action }} un employé</h1>
    <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        {{ form.non_field_errors }}
        <table>
            {% for field in form %}
            <tr>
                <th>{{ field.label_tag }}</th>
                <td>
                    {{ field }}
                    {% for error in field.errors %}
                        <div style="color: red;">{{ error }}</div>
                    {% endfor %}
                </td>
            </tr>
            {% endfor %}
        </table>
        <button type="submit" class="btn-csv" style="background:#1cc88a;">{{ action }}</button>
        <a href="{% url 'Employee:utilisateur_list' %}" class="btn-csv" style="background:#6c757d;">Annuler</a>
    </form>
</div>
{% endblock %}
