{% load static %}
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="logo-avatar">
            <img src="{% static 'img/logo.webp' %}" alt="Logo">
        </div>
        <h3 class="sidebar-title">BioAttend</h3>
    </div>

    <nav class="nav-menu">
        <a href="{% url 'dashboard:index' %}" class="nav-item {% if '/dashboard/' in request.path or request.path == '/dashboard' or request.path == '/' %}active{% endif %}">
            <i class="fas fa-home"></i>
            <span class="nav-label">Dashboard</span>
        </a>
        <a href="#" class="nav-item {% if '/employees' in request.path %}active{% endif %}">
            <i class="fas fa-users"></i>
            <span class="nav-label">Employés</span>
        </a>
        <a href="#" class="nav-item {% if '/statistiques' in request.path or '/stats' in request.path %}active{% endif %}">
            <i class="fas fa-chart-bar"></i>
            <span class="nav-label">Statistiques</span>
        </a>
        <a href="#" class="nav-item {% if '/alerts' in request.path or '/alertes' in request.path %}active{% endif %}">
            <i class="fas fa-bell"></i>
            <span class="nav-label">Alertes</span>
        </a>
        <a href="{% url 'accounts:settings' %}" class="nav-item {% if '/accounts/settings' in request.path %}active{% endif %}">
            <i class="fas fa-cog"></i>
            <span class="nav-label">Paramètres</span>
        </a>
    </nav>
</aside>
