{% load static %}
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="logo-avatar">
            <img src="{% static 'img/logo.webp' %}" alt="Logo">
        </div>
        <h3 class="sidebar-title">BioAttend</h3>
    </div>

    <nav class="nav-menu">
        {% if request.session.active_dashboard_space == 'employee' or user.is_employe and not user.is_platform_admin %}
            <a href="{% url 'dashboard:employee_home' %}" class="nav-item {% if request.path == '/dashboard/employe/' or request.path == '/dashboard/employe' %}active{% endif %}">
                <i class="fas fa-home"></i>
                <span class="nav-label">Mon espace</span>
            </a>
            <a href="{% url 'dashboard:employee_pointages' %}" class="nav-item {% if '/dashboard/employe/pointages' in request.path %}active{% endif %}">
                <i class="fas fa-fingerprint"></i>
                <span class="nav-label">Mes pointages</span>
            </a>
            <a href="{% url 'accounts:settings' %}" class="nav-item {% if '/accounts/settings' in request.path %}active{% endif %}">
                <i class="fas fa-cog"></i>
                <span class="nav-label">Paramètres</span>
            </a>
        {% else %}
            <a href="{% url 'dashboard:index' %}" class="nav-item {% if '/dashboard/' in request.path or request.path == '/dashboard' or request.path == '/' %}active{% endif %}">
                <i class="fas fa-home"></i>
                <span class="nav-label">Dashboard</span>
            </a>
            <a href="{% url 'Employee:utilisateur_list' %}" class="nav-item {% if '/Employee/' in request.path and '/Employee/pointages/' not in request.path and '/Employee/alertes/' not in request.path %}active{% endif %}">
                <i class="fas fa-users"></i>
                <span class="nav-label">Employés</span>
            </a>
            <a href="{% url 'Employee:pointage_list' %}" class="nav-item {% if '/Employee/pointages/' in request.path %}active{% endif %}">
                <i class="fas fa-chart-bar"></i>
                <span class="nav-label">Statistiques</span>
            </a>
            <a href="{% url 'accounts:settings' %}" class="nav-item {% if '/accounts/settings' in request.path %}active{% endif %}">
                <i class="fas fa-cog"></i>
                <span class="nav-label">Paramètres</span>
            </a>
        {% endif %}
    </nav>
</aside>
