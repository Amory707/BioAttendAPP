{% extends 'dashboard/base.html' %}

{% block content %}
  <div class="page active">
    <div class="page-header">
      <h1>Changer le mot de passe</h1>
    </div>
    <div class="charts-container">
      <form method="post" class="" style="max-width:480px;">
        {% csrf_token %}
        <div class="form-group">
          <label for="id_old_password">Ancien mot de passe</label>
          {{ form.old_password }}
        </div>
        <div class="form-group">
          <label for="id_new_password1">Nouveau mot de passe</label>
          {{ form.new_password1 }}
        </div>
        <div class="form-group">
          <label for="id_new_password2">Confirmez le nouveau mot de passe</label>
          {{ form.new_password2 }}
        </div>

        <div style="display:flex; gap:12px; margin-top:12px;">
          <button type="submit" class="btn btn-primary">Enregistrer</button>
          <a class="btn btn-secondary" href="{% url 'accounts:settings' %}">Annuler</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
