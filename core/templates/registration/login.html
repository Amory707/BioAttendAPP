{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
  <div class="container">
    <h1>Connexion</h1>

    {% if form.errors %}
      <p style="color:red;">Nom d'utilisateur ou mot de passe invalide.</p>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div>
        <label for="id_username">Nom d'utilisateur :</label><br>
        {{ form.username }}
      </div>
      <div>
        <label for="id_password">Mot de passe :</label><br>
        {{ form.password }}
      </div>
      <button type="submit">Se connecter</button>
    </form>

    <p><a href="{% url 'password_reset' %}">Mot de passe oublié ?</a></p>
  </div>
{% endblock %}
